name: Unity License Setup Guide

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Explain current Unity Personal license requirement
        run: |
          echo "::error::The old GameCI manual activation-file action is deprecated and intentionally fails."
          echo "Unity Personal manual activation is no longer supported by Unity/GameCI's documented flow."
          echo "Use a valid Unity license file obtained through a supported Unity licensing process, then add its contents as the repository Actions secret UNITY_LICENSE."
          echo "Do not add Unity account passwords or license contents to repository files or commits."
          exit 1
