name: Request Unity Personal Activation File

on:
  workflow_dispatch:
  push:
    branches:
      - unity-rebuild
    paths:
      - ".github/workflows/unity-activation.yml"

permissions:
  contents: read

jobs:
  request-activation:
    name: Generate activation request
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.26f1

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-Request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7
