name: Unity License Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Explain supported Unity Personal licensing route
        run: |
          echo "The old GameCI request-activation-file action is deprecated and cannot create a Personal license request."
          echo "Unity Personal licenses must be activated by signing in through Unity Hub, or through a currently supported online Unity licensing flow."
          echo "For this cloud build, make sure the Unity license material is obtained through a supported route and stored in GitHub Actions as UNITY_LICENSE."
          echo "If your build uses account credentials for the supported GameCI activation flow, store them only as Actions secrets, never in source code."
          echo "Official Unity license guidance: https://docs.unity.com/en-us/hub/manage-license"
          echo "Official GameCI activation guidance: https://game.ci/docs/github/activation"
          echo "This job only reports setup guidance; it does not claim a license has been activated."
