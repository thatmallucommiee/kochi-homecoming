name: Build Kochi Homecoming v3.2 Android APK

on:
  push:
    branches: [build-v3-2-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Assemble v3.2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/source"
          cat kochi-source-v3.2.tar.xz.b64.part* | base64 --decode | tar -xJ -C "$GITHUB_WORKSPACE/source"
          test -f "$GITHUB_WORKSPACE/source/project.godot"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Install branded Android launcher icons
        shell: bash
        run: |
          set -euo pipefail
          ICON_SOURCE="$GITHUB_WORKSPACE/assets/kochi_homecoming_icon_128.png"
          test -s "$ICON_SOURCE"
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          command -v convert
          mkdir -p "$PROJECT_DIR/assets"
          # Legacy icon: preserve the supplied KOCHI HOMECOMING artwork.
          convert "$ICON_SOURCE" -filter Lanczos -resize 512x512! "$PROJECT_DIR/assets/launcher_icon_512.png"
          # Android adaptive foreground uses a generous safe-zone margin so launchers can mask it cleanly.
          convert "$ICON_SOURCE" -filter Lanczos -resize 260x260! -background none -gravity center -extent 432x432 "$PROJECT_DIR/assets/launcher_icon_foreground_432.png"
          convert -size 432x432 xc:'#071218' "$PROJECT_DIR/assets/launcher_icon_background_432.png"
          python3 - "$PROJECT_DIR/project.godot" "$PROJECT_DIR/export_presets.cfg" "$PROJECT_DIR/assets" <<'PY'
          from pathlib import Path
          import struct
          import sys

          project_path, preset_path, assets_path = map(Path, sys.argv[1:])
          project = project_path.read_text(encoding="utf-8")
          preset = preset_path.read_text(encoding="utf-8")
          assets = {
              "launcher_icon_512.png": (512, 512),
              "launcher_icon_foreground_432.png": (432, 432),
              "launcher_icon_background_432.png": (432, 432),
          }
          for name, expected in assets.items():
              data = (assets_path / name).read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"{name} is not a PNG"
              size = struct.unpack(">II", data[16:24])
              assert size == expected, f"{name}: expected {expected}, got {size}"
          if 'config/icon="res://assets/launcher_icon_512.png"' not in project:
              marker = 'config/name="Kochi: Homecoming"'
              assert marker in project, "Could not locate project application name"
              project = project.replace(marker, marker + '\nconfig/icon="res://assets/launcher_icon_512.png"', 1)
              project_path.write_text(project, encoding="utf-8")
          options = (
              'launcher_icons/main_192x192="res://assets/launcher_icon_512.png"',
              'launcher_icons/adaptive_foreground_432x432="res://assets/launcher_icon_foreground_432.png"',
              'launcher_icons/adaptive_background_432x432="res://assets/launcher_icon_background_432.png"',
          )
          for option in options:
              key = option.split("=", 1)[0]
              if key + "=" not in preset:
                  marker = 'screen/orientation=1'
                  assert marker in preset, "Could not locate Android export options"
                  preset = preset.replace(marker, marker + '\n' + option, 1)
              else:
                  lines = preset.splitlines()
                  preset = '\n'.join(option if line.startswith(key + "=") else line for line in lines) + '\n'
          preset_path.write_text(preset, encoding="utf-8")
          assert 'config/icon="res://assets/launcher_icon_512.png"' in project
          assert all(option in preset for option in options)
          print("Branded launcher icon verified: project icon, legacy icon, and Android adaptive foreground/background.")
          PY

      - name: Apply Godot 4.7 strict typing fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/scripts/player_controller.gd" "$PROJECT_DIR/scripts/mission_manager.gd" <<'PY'
          from pathlib import Path
          import sys
          player = Path(sys.argv[1])
          text = player.read_text()
          fixes = {
              "var vehicle_heading := active_vehicle.rotation.y if active_vehicle != null and is_instance_valid(active_vehicle) else 0.0": "var vehicle_heading: float = active_vehicle.rotation.y if active_vehicle != null and is_instance_valid(active_vehicle) else 0.0",
              "var car := active_vehicle": "var car: Variant = active_vehicle",
              "var side := car.global_basis.x": "var side: Vector3 = car.global_basis.x",
              "var world_camera_yaw := car.rotation.y + camera_yaw": "var world_camera_yaw: float = car.rotation.y + camera_yaw",
          }
          for old, new in fixes.items():
              text = text.replace(old, new)
          player.write_text(text)
          missions = Path(sys.argv[2])
          text = missions.read_text()
          text = text.replace(
              'var start_pos := game.gps_to_world(float(data.get("lat", 9.96)), float(data.get("lon", 76.25)))',
              'var start_pos: Vector3 = game.gps_to_world(float(data.get("lat", 9.96)), float(data.get("lon", 76.25)))'
          )
          missions.write_text(text)
          PY

      - name: Fix remaining Godot 4.7 inferred types
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/scripts/game.gd" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace(chr(92) + "n", chr(10))
          for name, typ in [("bx", "float"), ("wx", "float"), ("d", "float"), ("spawn_pos", "Vector3")]:
              s = s.replace("var " + name + " :=", "var " + name + ": " + typ + " =")
          p.write_text(s)
          PY

      - name: Fix mobile movement and vehicle controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/scripts/hud.gd" "$PROJECT_DIR/tools/validate_source.py" <<'PY'
          from pathlib import Path
          import sys

          hud_path = Path(sys.argv[1])
          s = hud_path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, reason: str) -> None:
              global s
              if old not in s:
                  raise SystemExit("Could not apply mobile-control fix: " + reason)
              s = s.replace(old, new, 1)

          replace_once(
              "var joystick_active := false\nvar toast_clock := 0.0",
              "var joystick_active := false\nvar joystick_touch_index := -1\nvar vehicle_steer_left_held := false\nvar vehicle_steer_right_held := false\nvar toast_clock := 0.0",
              "control-state declarations"
          )
          replace_once(
              "pad.gui_input.connect(_on_joystick.bind(joystick_control))",
              "pad.gui_input.connect(_on_joystick.bind(pad))",
              "joystick pad binding"
          )
          replace_once(
              'var left := _button("◀", Vector2(-310, -84), Vector2(46, 52))',
              'var left := _left_bottom_button("◀ LEFT", 26, -132, Vector2(94, 62))',
              "left steering-button position"
          )
          replace_once(
              'var right := _button("▶", Vector2(-258, -84), Vector2(46, 52))',
              'var right := _left_bottom_button("RIGHT ▶", 130, -132, Vector2(104, 62))',
              "right steering-button position"
          )
          replace_once(
              '''    left.button_down.connect(func():
                  if player != null:
                      player.touch_steer = -1.0
              )
              left.button_up.connect(func():
                  if player != null and player.touch_steer < 0.0:
                      player.touch_steer = 0.0
              )''',
              '''    left.button_down.connect(func():
                  vehicle_steer_left_held = true
                  _sync_vehicle_steering()
              )
              left.button_up.connect(func():
                  vehicle_steer_left_held = false
                  _sync_vehicle_steering()
              )''',
              "left steering input"
          )
          replace_once(
              '''    right.button_down.connect(func():
                  if player != null:
                      player.touch_steer = 1.0
              )
              right.button_up.connect(func():
                  if player != null and player.touch_steer > 0.0:
                      player.touch_steer = 0.0
              )''',
              '''    right.button_down.connect(func():
                  vehicle_steer_right_held = true
                  _sync_vehicle_steering()
              )
              right.button_up.connect(func():
                  vehicle_steer_right_held = false
                  _sync_vehicle_steering()
              )''',
              "right steering input"
          )
          replace_once(
              "func _button(label: String, offsets: Vector2, button_size: Vector2) -> Button:\n",
              '''func _sync_vehicle_steering() -> void:
              if player != null:
                  player.touch_steer = (1.0 if vehicle_steer_right_held else 0.0) - (1.0 if vehicle_steer_left_held else 0.0)

          func _left_bottom_button(label: String, x: float, top_offset: float, button_size: Vector2) -> Button:
              var b := Button.new()
              b.text = label
              b.anchor_left = 0
              b.anchor_right = 0
              b.anchor_top = 1
              b.anchor_bottom = 1
              b.offset_left = x
              b.offset_top = top_offset
              b.offset_right = x + button_size.x
              b.offset_bottom = top_offset + button_size.y
              b.custom_minimum_size = button_size
              b.add_theme_font_size_override("font_size", 13)
              root.add_child(b)
              return b

          func _button(label: String, offsets: Vector2, button_size: Vector2) -> Button:
          ''',
              "left-anchored steering-button helper"
          )
          replace_once(
              "joystick.global_position + Vector2(78, 78)",
              "Vector2(78, 78)",
              "joystick local-space centre"
          )
          replace_once(
              '''    if player != null:
                  player.touch_move = Vector2(d.x / 52.0, d.y / 52.0)''',
              '''    if player != null:
                  # Pass both axes through: up/down and left/right are all supported.
                  player.touch_move = Vector2(d.x / 52.0, d.y / 52.0)''',
              "joystick two-axis mapping"
          )
          replace_once(
              '''func refresh_context() -> void:
              player = game.player if game != null else null
              var in_car := player != null and player.active_vehicle != null
              for control in onfoot_controls:''',
              '''func refresh_context() -> void:
              player = game.player if game != null else null
              var in_car := player != null and player.active_vehicle != null
              # Clear stale touches when the HUD switches between walking and driving.
              joystick_active = false
              joystick_touch_index = -1
              vehicle_steer_left_held = false
              vehicle_steer_right_held = false
              if player != null:
                  player.touch_move = Vector2.ZERO
                  player.touch_steer = 0.0
                  player.touch_throttle = 0.0
                  player.touch_brake = 0.0
                  player.touch_handbrake = false
              if joystick_knob != null:
                  joystick_knob.position = Vector2(51, 51)
              for control in onfoot_controls:''',
              "context-switch touch reset"
          )
          hud_path.write_text(s, encoding="utf-8")

          # Make the existing source validation protect these input regressions.
          check_path = Path(sys.argv[2])
          checks = check_path.read_text(encoding="utf-8")
          marker = 'assert (root / "export_presets.cfg").is_file(), "Android export preset missing"\n'
          additions = (
              marker
              + 'hud = (root / "scripts/hud.gd").read_text(encoding="utf-8")\n'
              + 'assert "pad.gui_input.connect(_on_joystick.bind(pad))" in hud, "joystick must use pad-local coordinates"\n'
              + 'assert "var center := Vector2(78, 78)" in hud and "(pos - center)" in hud, "joystick must map both axes from its local centre"\n'
              + 'assert "_left_bottom_button(\\"◀ LEFT\\"" in hud and "_left_bottom_button(\\"RIGHT ▶\\"" in hud, "vehicle steering buttons missing"\n'
              + 'assert "_sync_vehicle_steering()" in hud, "vehicle steering input handler missing"\n'
          )
          if 'joystick must use pad-local coordinates' not in checks:
              if marker not in checks:
                  raise SystemExit("Could not add touch-control regression assertions.")
              checks = checks.replace(marker, additions, 1)
              check_path.write_text(checks, encoding="utf-8")

          # A compact independent test verifies cardinal directions and steering regressions.
          (check_path.parent / "test_touch_controls.py").write_text('''from pathlib import Path
          import math

          root = Path(__file__).resolve().parents[1]
          hud = (root / "scripts/hud.gd").read_text(encoding="utf-8")

          def axis(x, y):
              dx, dy = x - 78.0, y - 78.0
              length = math.hypot(dx, dy)
              if length > 52.0:
                  dx, dy = dx * 52.0 / length, dy * 52.0 / length
              return dx / 52.0, dy / 52.0

          assert axis(78, 26) == (0.0, -1.0), "up must move forward"
          assert axis(78, 130) == (0.0, 1.0), "down must move backward"
          assert axis(26, 78) == (-1.0, 0.0), "left must remain left"
          assert axis(130, 78) == (1.0, 0.0), "right must remain right"
          assert "var center := Vector2(78, 78)" in hud and "(pos - center)" in hud
          assert "_left_bottom_button(\\"◀ LEFT\\"" in hud
          assert "_left_bottom_button(\\"RIGHT ▶\\"" in hud
          assert "vehicle_steer_left_held = true" in hud and "vehicle_steer_right_held = true" in hud
          print("Touch-control regression passed: joystick four-way movement and dedicated left/right vehicle steering.")
          ''', encoding="utf-8")
          print("Applied mobile-control fixes: local-space joystick, dedicated left-side steering controls, and touch-state reset.")
          PY

      - name: Improve sedan visual detail and daylight
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/scripts/vehicle_controller.gd" "$PROJECT_DIR/scripts/game.gd" <<'PY'
          from pathlib import Path
          import sys

          vehicle_path = Path(sys.argv[1])
          s = vehicle_path.read_text(encoding="utf-8")
          expected = "    cabin.material_override = glass\n    add_child(cabin)\n    for side in [-1.0, 1.0]:"
          if expected not in s:
              raise SystemExit("Vehicle visual source changed; refusing to patch an unknown layout.")

          detail = """    cabin.material_override = glass
              add_child(cabin)
              # Distinct body planes break up the single-box silhouette.
              _add_detail_box("Hood", Vector3(1.68, 0.14, 1.22), Vector3(0, 0.965, -1.02), Color.BLACK, true)
              _add_detail_box("Trunk", Vector3(1.62, 0.13, 0.78), Vector3(0, 0.96, 1.20), Color.BLACK, true)
              _add_detail_box("Roof", Vector3(1.30, 0.13, 1.22), Vector3(0, 1.51, -0.19), Color.BLACK, true)

              var window_mat := StandardMaterial3D.new()
              window_mat.albedo_color = Color(0.055, 0.12, 0.15)
              window_mat.metallic = 0.28
              window_mat.roughness = 0.2
              _add_detail_box("FrontWindshield", Vector3(1.16, 0.30, 0.035), Vector3(0, 1.28, -1.055), Color(0.055, 0.12, 0.15))
              _add_detail_box("RearWindshield", Vector3(1.12, 0.27, 0.035), Vector3(0, 1.27, 0.685), Color(0.055, 0.12, 0.15))
              for side in [-1.0, 1.0]:
                  var side_window_front := _add_detail_box("FrontSideWindow", Vector3(0.035, 0.29, 0.62), Vector3(side * 0.725, 1.29, -0.63), Color(0.055, 0.12, 0.15))
                  var side_window_rear := _add_detail_box("RearSideWindow", Vector3(0.035, 0.29, 0.58), Vector3(side * 0.725, 1.29, 0.23), Color(0.055, 0.12, 0.15))
                  _add_detail_box("WindowPillar", Vector3(0.045, 0.42, 0.075), Vector3(side * 0.735, 1.30, -0.12), Color(0.025, 0.035, 0.04))
                  _add_detail_box("DoorHandle", Vector3(0.035, 0.045, 0.20), Vector3(side * 0.966, 0.92, 0.25), Color(0.66, 0.69, 0.68), false)

              _add_detail_box("FrontBumper", Vector3(1.94, 0.14, 0.16), Vector3(0, 0.39, -1.84), Color(0.07, 0.08, 0.085))
              _add_detail_box("RearBumper", Vector3(1.94, 0.14, 0.16), Vector3(0, 0.39, 1.84), Color(0.07, 0.08, 0.085))
              _add_detail_box("FrontGrille", Vector3(0.60, 0.20, 0.035), Vector3(0, 0.64, -1.855), Color(0.018, 0.025, 0.028))
              for bar_y in [0.59, 0.64, 0.69]:
                  _add_detail_box("GrilleSlat", Vector3(0.52, 0.018, 0.045), Vector3(0, bar_y, -1.878), Color(0.26, 0.30, 0.31))
              for side in [-1.0, 1.0]:
                  _add_detail_box("Headlamp", Vector3(0.34, 0.15, 0.05), Vector3(side * 0.62, 0.77, -1.84), Color(0.96, 0.84, 0.61))
                  _add_detail_box("TailLamp", Vector3(0.24, 0.17, 0.05), Vector3(side * 0.68, 0.75, 1.84), Color(0.72, 0.055, 0.035))
                  _add_detail_box("SideMirror", Vector3(0.15, 0.11, 0.20), Vector3(side * 0.84, 1.11, -0.69), Color.BLACK, true)
                  _add_detail_box("PlateBoltTrim", Vector3(0.42, 0.10, 0.03), Vector3(0, 0.50, -1.87), Color(0.76, 0.79, 0.73))
          """
          # This is a textual replacement preserving the existing wheel loop.
          replacement = detail + "    for side in [-1.0, 1.0]:"
          s = s.replace(expected, replacement, 1)

          # Reuse the body paint material for painted panels so tint changes affect the whole car.
          helper = """
          func _add_detail_box(node_name: String, box_size: Vector3, at: Vector3, color: Color, use_paint: bool = false) -> MeshInstance3D:
              var part := MeshInstance3D.new()
              part.name = node_name
              var mesh := BoxMesh.new()
              mesh.size = box_size
              part.mesh = mesh
              part.position = at
              if use_paint and paint_material != null:
                  part.material_override = paint_material
              else:
                  var material := StandardMaterial3D.new()
                  material.albedo_color = color
                  material.roughness = 0.48
                  material.metallic = 0.05
                  part.material_override = material
              add_child(part)
              return part

          """
          signature = "func set_driver(value) -> void:\n"
          if signature not in s:
              raise SystemExit("Could not locate vehicle helper insertion point.")
          s = s.replace(signature, helper + signature, 1)

          # Add brushed-metal hub faces on the four existing wheels.
          wheel_marker = "            wheel.material_override = rubber\n            add_child(wheel)"
          wheel_detail = """            wheel.material_override = rubber
                      add_child(wheel)
                      var hub := MeshInstance3D.new()
                      hub.name = "WheelHub"
                      var hub_mesh := CylinderMesh.new()
                      hub_mesh.top_radius = 0.16
                      hub_mesh.bottom_radius = 0.16
                      hub_mesh.height = 0.035
                      hub.mesh = hub_mesh
                      hub.rotation.z = PI / 2.0
                      hub.position = Vector3(side * 1.09, 0.31, z)
                      var hub_mat := StandardMaterial3D.new()
                      hub_mat.albedo_color = Color(0.48, 0.52, 0.54)
                      hub_mat.metallic = 0.62
                      hub_mat.roughness = 0.32
                      hub.material_override = hub_mat
                      add_child(hub)"""
          if wheel_marker not in s:
              raise SystemExit("Could not locate the wheel material block.")
          s = s.replace(wheel_marker, wheel_detail, 1)
          vehicle_path.write_text(s, encoding="utf-8")

          game_path = Path(sys.argv[2])
          g = game_path.read_text(encoding="utf-8")
          replacements = {
              "env.background_color = Color(0.035, 0.055, 0.075)": "env.background_color = Color(0.31, 0.48, 0.59)",
              "env.ambient_light_color = Color(0.48, 0.56, 0.63)": "env.ambient_light_color = Color(0.67, 0.71, 0.72)",
              "env.ambient_light_energy = 0.65": "env.ambient_light_energy = 0.82",
              "env.fog_light_color = Color(0.4, 0.49, 0.56)": "env.fog_light_color = Color(0.55, 0.65, 0.70)",
              "env.fog_density = 0.006": "env.fog_density = 0.0022",
              "sun.light_energy = 1.0": "sun.light_energy = 1.18",
          }
          for old, new in replacements.items():
              if old not in g:
                  raise SystemExit("Could not locate graphics setting: " + old)
              g = g.replace(old, new, 1)
          game_path.write_text(g, encoding="utf-8")
          print("Added sedan exterior details and improved daytime visibility.")
          PY

      - name: Improve character silhouette and street materials
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/scripts/player_controller.gd" "$PROJECT_DIR/scripts/game.gd" "$PROJECT_DIR/tools" <<'PY'
          from pathlib import Path
          import sys

          def replace_once(source: str, old: str, new: str, reason: str) -> str:
              if old not in source:
                  raise SystemExit("Could not apply visual pass: " + reason)
              return source.replace(old, new, 1)

          def insert_after_line(source: str, contains: str, additions: list[str], reason: str, start_at: str = "") -> str:
              lines = source.splitlines()
              begin = 0
              if start_at:
                  for j, line in enumerate(lines):
                      if start_at in line:
                          begin = j
                          break
                  else:
                      raise SystemExit("Could not locate section for " + reason)
              for i in range(begin, len(lines)):
                  if contains in lines[i]:
                      indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
                      lines[i + 1:i + 1] = [indent + item for item in additions]
                      return "\n".join(lines) + "\n"
              raise SystemExit("Could not locate insertion line for " + reason)

          player_path = Path(sys.argv[1])
          p = player_path.read_text(encoding="utf-8")
          p = replace_once(p, "clothes.albedo_color = Color(0.07, 0.12, 0.16)", "clothes.albedo_color = Color(0.13, 0.19, 0.22)", "shirt material")
          p = p.replace("material.albedo_color = Color(0.07, 0.12, 0.16)", "material.albedo_color = Color(0.13, 0.19, 0.22)", 1)

          p = replace_once(
              p,
              "    visual_root.add_child(head)\n    arm_l = _make_limb(Vector3(-0.4, 1.08, 0), clothes, 0.11, 0.82)",
              """    visual_root.add_child(head)
              _detail_sphere("Hair", Vector3(0, 1.925, 0.015), Vector3(0.40, 0.20, 0.42), Color(0.035, 0.027, 0.022))
              _detail_sphere("Beard", Vector3(0, 1.655, -0.174), Vector3(0.22, 0.13, 0.075), Color(0.07, 0.045, 0.032))
              _detail_sphere("Nose", Vector3(0, 1.765, -0.224), Vector3(0.055, 0.075, 0.045), skin.albedo_color)
              for eye_side in [-1.0, 1.0]:
                  _detail_sphere("EyeWhite", Vector3(eye_side * 0.078, 1.80, -0.190), Vector3(0.065, 0.042, 0.035), Color(0.80, 0.76, 0.66))
                  _detail_sphere("Pupil", Vector3(eye_side * 0.078, 1.80, -0.219), Vector3(0.026, 0.028, 0.018), Color(0.035, 0.025, 0.02))
              var trousers := StandardMaterial3D.new()
              trousers.albedo_color = Color(0.075, 0.09, 0.105)
              trousers.roughness = 0.91
              arm_l = _make_limb(Vector3(-0.4, 1.08, 0), clothes, 0.11, 0.82)""",
              "character face and limb material"
          )
          p = replace_once(
              p,
              "    leg_l = _make_limb(Vector3(-0.17, 0.43, 0), clothes, 0.13, 0.8)",
              "    leg_l = _make_limb(Vector3(-0.17, 0.43, 0), trousers, 0.13, 0.8)",
              "left trouser material"
          )
          p = replace_once(
              p,
              "    leg_r = _make_limb(Vector3(0.17, 0.43, 0), clothes, 0.13, 0.8)",
              """    leg_r = _make_limb(Vector3(0.17, 0.43, 0), trousers, 0.13, 0.8)
              _detail_box("LeftShoe", Vector3(0.22, 0.12, 0.33), Vector3(-0.17, 0.085, -0.07), Color(0.025, 0.03, 0.032))
              _detail_box("RightShoe", Vector3(0.22, 0.12, 0.33), Vector3(0.17, 0.085, -0.07), Color(0.025, 0.03, 0.032))""",
              "shoe details"
          )
          character_helpers = """func _detail_sphere(node_name: String, at: Vector3, part_scale: Vector3, color: Color) -> MeshInstance3D:
              var part := MeshInstance3D.new()
              part.name = node_name
              var mesh := SphereMesh.new()
              mesh.radius = 0.5
              mesh.height = 1.0
              part.mesh = mesh
              part.position = at
              part.scale = part_scale
              var material := StandardMaterial3D.new()
              material.albedo_color = color
              material.roughness = 0.86
              part.material_override = material
              visual_root.add_child(part)
              return part

          func _detail_box(node_name: String, box_size: Vector3, at: Vector3, color: Color) -> MeshInstance3D:
              var part := MeshInstance3D.new()
              part.name = node_name
              var mesh := BoxMesh.new()
              mesh.size = box_size
              part.mesh = mesh
              part.position = at
              var material := StandardMaterial3D.new()
              material.albedo_color = color
              material.roughness = 0.88
              part.material_override = material
              visual_root.add_child(part)
              return part

          """
          helper_marker = "func _make_limb(pos: Vector3, mat: Material, radius: float, height: float) -> MeshInstance3D:\n"
          p = replace_once(p, helper_marker, character_helpers + helper_marker, "character helper functions")
          player_path.write_text(p, encoding="utf-8")

          game_path = Path(sys.argv[2])
          g = game_path.read_text(encoding="utf-8")
          g = replace_once(g, "var garage_hostiles_spawned := false", "var garage_hostiles_spawned := false\nvar road_grain_texture: Texture2D\nvar facade_grain_texture: Texture2D", "world texture variables")
          texture_helper = """func _make_grain_texture(seed_value: int) -> Texture2D:
              var image := Image.create(96, 96, false, Image.FORMAT_RGBA8)
              var noise := FastNoiseLite.new()
              noise.seed = seed_value
              noise.frequency = 0.075
              var rng := RandomNumberGenerator.new()
              rng.seed = seed_value
              for y in range(96):
                  for x in range(96):
                      var broad := noise.get_noise_2d(float(x), float(y))
                      var value := clampf(0.87 + broad * 0.075 + rng.randf_range(-0.035, 0.035), 0.72, 1.0)
                      image.set_pixel(x, y, Color(value, value, value, 1.0))
              return ImageTexture.create_from_image(image)

          """
          g = replace_once(g, "func _create_environment() -> void:\n", texture_helper + "func _create_environment() -> void:\n", "grain texture helper")
          g = replace_once(
              g,
              "    add_child(world)\n    # Compact, low-cost generated blockout aligned to the supplied Kochi GPS bounds.",
              "    add_child(world)\n    road_grain_texture = _make_grain_texture(2741)\n    facade_grain_texture = _make_grain_texture(9049)\n    # Compact, low-cost generated blockout aligned to the supplied Kochi GPS bounds.",
              "world texture initialisation"
          )
          g = insert_after_line(g, 'add_box(world, "RoadNS", Vector3(x, -0.015, 0)', [
              'add_box(world, "RoadEdgeLine", Vector3(x - 6.45, 0.078, 0), Vector3(0.11, 0.025, 450), Color(0.62, 0.64, 0.60), false)',
              'add_box(world, "RoadEdgeLine", Vector3(x + 6.45, 0.078, 0), Vector3(0.11, 0.025, 450), Color(0.62, 0.64, 0.60), false)',
          ], "north-south road-edge markings", "func _create_world")
          g = insert_after_line(g, 'add_box(world, "RoadEW", Vector3(0, -0.01, z)', [
              'add_box(world, "RoadEdgeLine", Vector3(0, 0.078, z - 6.45), Vector3(520, 0.025, 0.11), Color(0.62, 0.64, 0.60), false)',
              'add_box(world, "RoadEdgeLine", Vector3(0, 0.078, z + 6.45), Vector3(520, 0.025, 0.11), Color(0.62, 0.64, 0.60), false)',
          ], "east-west road-edge markings", "func _create_world")

          crosswalk = """    # Painted crossing at the main junction to break up the flat road plane.
              for stripe in range(6):
                  add_box(world, "CrosswalkNS", Vector3(0, 0.09, -10.0 + float(stripe) * 1.25), Vector3(12.2, 0.025, 0.58), Color(0.76, 0.77, 0.72), false)
                  add_box(world, "CrosswalkEW", Vector3(-10.0 + float(stripe) * 1.25, 0.09, 0), Vector3(0.58, 0.025, 12.2), Color(0.76, 0.77, 0.72), false)
          """
          g = replace_once(g, "    # Buildings placed in blocks;", crosswalk + "    # Buildings placed in blocks;", "junction crossing")
          g = insert_after_line(g, 'add_box(world, "RoofParapet"', [
              'if int(abs(x * 2 + z)) % 3 == 0:',
              '    add_cylinder(world, "RooftopWaterTank", Vector3(bx + width * 0.22, height + 0.72, bz + 3.4), 0.42, 0.95, Color(0.18, 0.23, 0.25), false)',
              '    add_box(world, "WaterTankBase", Vector3(bx + width * 0.22, height + 0.19, bz + 3.4), Vector3(1.0, 0.12, 1.0), Color(0.28, 0.29, 0.27), false)',
          ], "rooftop tanks", "func _create_world")
          g = insert_after_line(g, 'add_box(world, "DarkWindow"', [
              'add_box(world, "WindowSill", Vector3(wx, wy - 0.51, bz - 8.63), Vector3(1.30, 0.08, 0.10), Color(0.27,0.29,0.28), false)',
              'add_box(world, "WindowLintel", Vector3(wx, wy + 0.51, bz - 8.63), Vector3(1.30, 0.08, 0.10), Color(0.31,0.31,0.29), false)',
              'add_box(world, "WindowFrame", Vector3(wx - 0.61, wy, bz - 8.63), Vector3(0.07, 1.05, 0.10), Color(0.25,0.28,0.28), false)',
              'add_box(world, "WindowFrame", Vector3(wx + 0.61, wy, bz - 8.63), Vector3(0.07, 1.05, 0.10), Color(0.25,0.28,0.28), false)',
          ], "window frames", "func _create_world")

          lines = g.splitlines()
          in_add_box = False
          for i, line in enumerate(lines):
              if line.startswith("func add_box("):
                  in_add_box = True
              elif in_add_box and line.startswith("func add_cylinder("):
                  break
              if in_add_box and "material.metallic = 0.02" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  additions = [
                      'if node_name == "RoadNS" or node_name == "RoadEW":',
                      "    material.albedo_texture = road_grain_texture",
                      "    material.uv1_triplanar = true",
                      "    material.uv1_scale = Vector3(2.0, 2.0, 2.0)",
                      "    material.roughness = 0.94",
                      'elif node_name == "KochiBuilding":',
                      "    material.albedo_texture = facade_grain_texture",
                      "    material.uv1_triplanar = true",
                      "    material.uv1_scale = Vector3(1.4, 1.4, 1.4)",
                      "    material.roughness = 0.92",
                  ]
                  lines[i + 1:i + 1] = [indent + item for item in additions]
                  break
          else:
              raise SystemExit("Could not insert surface textures in add_box().")
          g = "\n".join(lines) + "\n"
          game_path.write_text(g, encoding="utf-8")

          tools_dir = Path(sys.argv[3])
          quality_test = '''from pathlib import Path

          root = Path(__file__).resolve().parents[1]
          game = (root / "scripts/game.gd").read_text(encoding="utf-8")
          player = (root / "scripts/player_controller.gd").read_text(encoding="utf-8")
          assert "road_grain_texture" in game and "uv1_triplanar = true" in game
          assert "RoadEdgeLine" in game and "CrosswalkNS" in game
          assert "RooftopWaterTank" in game and "WindowSill" in game
          assert '_detail_sphere("Hair"' in player and '_detail_box("LeftShoe"' in player
          print("Visual source checks passed: road/facade grain, road markings, rooftop/window detail and readable player silhouette.")
          '''
          (tools_dir / "test_visual_quality.py").write_text(quality_test, encoding="utf-8")
          print("Applied player silhouette, procedural road/facade grain, road-edge lines, crossing, window trims and rooftop tanks.")
          PY

