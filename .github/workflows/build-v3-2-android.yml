                  add_cylinder(world, "FishingNetCounterMast", Vector3(net_x + 5.2, 3.0, 230.0), 0.11, 6.0, Color(0.28, 0.24, 0.18), false)
                  var net_boom := add_box(world, "FishingNetBoom", Vector3(net_x + 2.6, 7.1, 230.0), Vector3(6.9, 0.14, 0.16), Color(0.31, 0.26, 0.18), false)
                  net_boom.rotation.z = -0.23
                  var net_crossbar := add_box(world, "FishingNetCrossbar", Vector3(net_x + 3.2, 5.5, 230.0), Vector3(0.10, 4.0, 0.12), Color(0.30, 0.25, 0.18), false)
