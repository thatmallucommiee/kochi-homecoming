name: Build Kochi Homecoming v3.2 Android APK

on:
  push:
    branches: [build-v3-2-android]
    paths:
      - 'build-results/rebuild-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Assemble v3.2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/source"
          cat kochi-source-v3.2.tar.xz.b64.part* | base64 --decode | tar -xJ -C "$GITHUB_WORKSPACE/source"
          test -f "$GITHUB_WORKSPACE/source/project.godot"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"

      - name: Run static and drivetrain checks
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python3 tools/validate_source.py
          python3 tools/test_drivetrain.py

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"             -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"

      - name: Configure Android signing and editor paths
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v             -keystore "$HOME/debug.keystore"             -storepass android -alias androiddebugkey -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EDITORSETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EDITORSETTINGS

      - name: Import and validate Godot project
        shell: bash
        run: godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Smoke-test game startup
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --path "$PROJECT_DIR" --quit-after 4 2>&1 | tee "$RUNNER_TEMP/kochihomecoming-smoke.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Could not load script" "$RUNNER_TEMP/kochihomecoming-smoke.log"; then
            echo "Godot reported a script or scene startup error." >&2
            exit 1
          fi

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/out/Kochi-Homecoming-v0.3.2-debug.apk"
          test -s "$GITHUB_WORKSPACE/out/Kochi-Homecoming-v0.3.2-debug.apk"
          unzip -t "$GITHUB_WORKSPACE/out/Kochi-Homecoming-v0.3.2-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kochi-Homecoming-v0.3.2-debug-apk
          path: out/Kochi-Homecoming-v0.3.2-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable prerelease
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kochi-homecoming-v0.3.2-build-${{ github.run_number }}
          name: "Kochi: Homecoming v0.3.2 Android debug build"
          prerelease: true
          generate_release_notes: true
          files: out/Kochi-Homecoming-v0.3.2-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build outcome
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          set +e
          mkdir -p build-results
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_number=$GITHUB_RUN_NUMBER"
            echo "status=$BUILD_STATUS"
            echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "apk_release_tag=kochi-homecoming-v0.3.2-build-$GITHUB_RUN_NUMBER"
          } > build-results/latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-results/latest.txt
          git commit -m "Record v3.2 Android build result" || exit 0
          git push origin "HEAD:$GITHUB_REF_NAME"
