                  add_cylinder(world, "PromenadeLampPost", Vector3(amenity_x + 8.0, 2.45, 209.5), 0.07, 4.9, Color(0.19, 0.23, 0.24), false)
                  add_box(world, "PromenadeLampArm", Vector3(amenity_x + 8.28, 4.78, 209.5), Vector3(0.62, 0.07, 0.07), Color(0.20, 0.23, 0.23), false)
                  add_sphere(world, "PromenadeLampHead", Vector3(amenity_x + 8.52, 4.70, 209.5), Vector3(0.28, 0.16, 0.18), Color(0.92, 0.70, 0.38), false)
              # Fort Kochi's Chinese fishing-net silhouette: paired masts and angled booms at the waterline.
              for net_x in [-132.0, -72.0, -12.0]:
