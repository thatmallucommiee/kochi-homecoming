                  add_box(world, "PortCraneBrace", Vector3(crane_x + 3.0, 9.3, 270.0), Vector3(0.16, 5.2, 0.16), Color(0.25, 0.31, 0.32), false)
                  add_box(world, "PortContainer", Vector3(crane_x + 12.0, 1.3, 282.0), Vector3(11.5, 2.6, 4.0), Color(0.37, 0.12, 0.08), false)
