                  add_box(world, "BackwaterFerryCabin", Vector3(ferry_x - 1.0, 1.10, 256.0), Vector3(4.2, 1.2, 2.1), Color(0.70, 0.68, 0.58), false)
                  add_box(world, "BackwaterFerryRoof", Vector3(ferry_x - 1.0, 1.78, 256.0), Vector3(4.5, 0.12, 2.25), Color(0.18, 0.24, 0.25), false)

          '''
