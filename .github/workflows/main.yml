
name: Build Kochi Homecoming APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract prototype
        run: |
          mkdir source
          unzip -q Kochi_Playable_Android_Prototype.zip -d source

      - name: Configure app identity
        working-directory: source
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));

          config.appId = 'com.aswinmohan.kochihomecoming';
          config.appName = 'Kochi: Homecoming';

          fs.writeFileSync(
            path,
            JSON.stringify(config, null, 2) + '\n'
          );
          NODE

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Create Android project
        working-directory: source
        run: npx cap add android

      - name: Sync Android assets
        working-directory: source
        run: npx cap sync android

      - name: Set landscape orientation
        working-directory: source/android
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path("app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          pattern = r'<activity\b[^>]*>'
          match = re.search(pattern, content)

          if not match:
              raise SystemExit("ERROR: No activity tag found in AndroidManifest.xml")

          activity = match.group(0)

          if re.search(r'\bandroid:screenOrientation\s*=', activity):
              activity = re.sub(
                  r'\bandroid:screenOrientation\s*=\s*"[^"]*"',
                  'android:screenOrientation="landscape"',
                  activity
              )
          else:
              activity = activity[:-1] + ' android:screenOrientation="landscape">'

          content = content[:match.start()] + activity + content[match.end():]
          manifest.write_text(content)
          print("Landscape orientation configured.")
          PY

      - name: Verify Android manifest
        working-directory: source/android
        run: |
          grep -n 'screenOrientation="landscape"' app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: source/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kochi-Homecoming-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
