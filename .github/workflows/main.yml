
name: Build Kochi Homecoming APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract prototype
        run: |
          mkdir source
          unzip -q Kochi_Playable_Android_Prototype.zip -d source

      - name: Configure app identity and landscape
        working-directory: source
        run: |
          sed -i 's/Kochi: The Uncounted Road/Kochi: Homecoming/g' capacitor.config.json
          sed -i 's/com.aswinmohan.kochiuncountedroad/com.aswinmohan.kochihomecoming/g'

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aswinmohan.kochihomecoming",
            "appName": "Kochi: Homecoming",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Create Android project
        working-directory: source
        run: npx cap add android

      - name: Sync Android assets
        working-directory: source
        run: npx cap sync android

      - name: Set landscape orientation
        working-directory: source/android
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          sed -i 's/<activity /<activity android:screenOrientation="landscape" /' "$MANIFEST"

      - name: Build APK
        working-directory: source/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kochi-Homecoming-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
