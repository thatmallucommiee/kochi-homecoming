name: Build Kochi Homecoming APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract prototype
        run: |
          mkdir source
          unzip -q Kochi_Playable_Android_Prototype.zip -d source

      - name: Set app identity
        working-directory: source
        run: |
          sed -i 's/Kochi: The Uncounted Road/Kochi: Homecoming/g' capacitor.config.json
          sed -i 's/com.aswinmohan.kochiuncountedroad/com.aswinmohan.kochihomecoming/g' capacitor.config.json

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Build packaged offline Kochi map from OpenStreetMap
        working-directory: source
        run: python3 scripts/fetch_kochi_map.py

      - name: Vendor Three.js modules for fully offline runtime
        working-directory: source
        run: |
          mkdir -p www/vendor/jsm
          cp node_modules/three/build/three.module.js www/vendor/three.module.js
          cp -R node_modules/three/examples/jsm/. www/vendor/jsm/

      - name: Verify offline runtime assets
        working-directory: source
        run: |
          test -s www/assets/data/kochi-map.json
          test -s www/assets/textures/kochi-asphalt-2k.png
          test -s www/assets/textures/kochi-plaster-2k.png
          test -s www/vendor/three.module.js
          node --input-type=module --check < www/game.js
          node --check www/audio.js
          python3 -m py_compile scripts/fetch_kochi_map.py

      - name: Create Android project
        working-directory: source
        run: npx cap add android

      - name: Force landscape orientation
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if re.search(r'android:screenOrientation="[^"]+"', s):
              s = re.sub(r'android:screenOrientation="[^"]+"', 'android:screenOrientation="landscape"', s, count=1)
          else:
              s, count = re.subn(r'<activity\b', '<activity android:screenOrientation="landscape"', s, count=1)
              if count != 1:
                  raise SystemExit('Could not find Android activity in manifest')
          p.write_text(s)
          print('Configured Android activity for landscape mode')
          PY

      - name: Sync Android assets
        working-directory: source
        run: npx cap sync android

      - name: Build APK
        working-directory: source/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kochi-Homecoming-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
